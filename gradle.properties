org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
android.uniquePackageNames=false
android.r8.strictFullModeForKeepRules=false
# 沙箱 aarch64 构建时 aapt2 optimize 会静默产出坏 ap_，导致 release APK 缺
# AndroidManifest.xml + resources.arsc（见 BUILD_TROUBLESHOOTING.md 修复 1）。
# 关闭资源优化绕过该问题，代价是 release 资源不压缩，功能无损。
android.enableResourceOptimizations=false
